[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pressbench"
version = "1.2.0"
description = "PRESS — Pushback Resistance & Epistemic Stability Score benchmark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Desenyon"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.12.0",
    "httpx>=0.25.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.10",
    "build>=1.2",
    "setuptools>=77",
    "wheel",
]

[project.scripts]
press = "press.cli:main"

[tool.setuptools.packages.find]
include = ["press*"]

[tool.setuptools.package-data]
press = ["dataset/questions/*.json"]

[tool.mypy]
python_version = "3.10"
files = ["press"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
